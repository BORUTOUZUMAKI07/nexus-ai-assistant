# Alembic configuration for Nexus AI Assistant
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Use env var; overridden in env.py for async support
sqlalchemy.url = postgresql+asyncpg://nexus:nexus@localhost:5432/nexus_dev

[post_write_hooks]
# Optionally lint/format migration scripts
# hooks = autopep8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
