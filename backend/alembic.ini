# Alembic configuration for Nexus AI Assistant
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Both paths are resolved against the CURRENT WORKING DIRECTORY, not against
# this file, so they are only correct when alembic runs from `backend/` — which
# is what the Makefile and every documented command do.
script_location = migrations
# `..` is the repository root, and it has to be that. The migrations import
# application metadata as `from backend.app.domain...` (so autogenerate sees the
# same metadata the app uses), but `.` here means `backend/`, which puts
# `backend.app` on the path instead of `backend` and makes every one of the
# nine revisions fail at import with `No module named 'backend'` before Alembic
# has looked at a single statement.
prepend_sys_path = ..
version_path_separator = os
# Use env var; overridden in env.py for async support
sqlalchemy.url = postgresql+asyncpg://nexus:nexus@localhost:5432/nexus_dev

[post_write_hooks]
# Optionally lint/format migration scripts
# hooks = autopep8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
