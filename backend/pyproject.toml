[project]
name = "nexus-ai-backend"
version = "0.1.0"
description = "Production-grade AI Assistant backend following DDD, SOLID, and Harness Engineering"
authors = [{ name = "Nexus Team" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    # Web Framework & Server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    
    # Database & ORM
    #
    # EXACT, not a floor. The Dockerfile installs with `pip install .`, which
    # ignores uv.lock, so a `>=` here means the image gets whatever SQLModel is
    # newest -- and newer releases map `datetime` to a timezone-enforcing type
    # that rejects the naive-UTC timestamps this codebase deliberately stores
    # (55 model fields, 84 `datetime.now(UTC).replace(tzinfo=None)` sites).
    #
    # Measured in production, 2026-11-08: every conversation insert failed with
    #   StatementError: (builtins.ValueError) Datetime values must have timezone
    #   information. Use datetime.now(timezone.utc), or annotate the field with
    #   NaiveDatetime for naive storage.
    # raised from sqlmodel/sql/sqltypes.py *in the image* -- a file that does not
    # contain that check in the 0.0.42 the whole test suite runs against. So the
    # deployed build was a different version from the tested one: SIGN-IN worked
    # (existing rows, no insert) and the first message of every chat returned a
    # bare 500.
    "sqlmodel==0.0.42",
    "alembic>=1.13.0",
    # Mako is alembic's template engine, reached transitively. Declared
    # directly because CVE-2026-102991 (a Windows drive-letter path traversal
    # in TemplateLookup) is patched in 1.4.2 and the lock was resolving 1.4.1;
    # an unpinned transitive dependency silently steps back onto the vulnerable
    # one on the next lock. The module is not imported at app runtime.
    "mako>=1.4.2",
    # Same shape of problem as mako above, different advisory: Pillow reaches
    # the tree only through fastembed's embedding pre-processing, so nothing
    # here declares it and nothing would notice it going stale. pip-audit fails
    # the build on CVE-2026-96778 / GHSA-78g4-xqwv-q3g8 in 12.3.0, patched in
    # 13.0.0. Declared directly to hold the floor: `pip install .` in the image
    # resolves from these requirements, not from uv.lock.
    "pillow>=13.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary,pool]>=3.1.0",
    # greenlet powers the SQLAlchemy async bridge (AsyncSession) that sqlmodel's
    # asyncio extension relies on. It reaches the dev venv transitively, so a
    # local run never notices — but the Docker builder installs from pyproject
    # metadata only, the transitive edge is dev-scoped, and sqlmodel declares no
    # `[asyncio]` extra to borrow. Without this the production image dies at
    # first import with `ModuleNotFoundError: No module named 'greenlet'`.
    "greenlet>=3.0.0",
    
    # Caching (also the rate-limit and idempotency store). No queue: there is no
    # broker, worker or dashboard, because uploads index inline.
    "redis>=5.0.0",
    
    # Authentication & Security
    # PyJWT, not python-jose. python-jose 3.5.0 is the terminal release and
    # carries PYSEC-2026-4298 (algorithm confusion via DER-encoded keys) with
    # no patched version to move to, and it drags in ecdsa, which carries
    # PYSEC-2026-1325 (Minerva timing attack on P-256) with no patched release
    # either. PyJWT is the maintained equivalent and is already in the tree via
    # the MCP stack; it is declared directly here so the security-critical
    # import has a direct home. The app only ever signs HS256 (JWT_ALGORITHM in
    # config.py); PyJWT's ES* surface is never exercised.
    "pyjwt>=2.10.0",
    "passlib[bcrypt,argon2]>=1.7.4",
    "pyotp>=2.9.0",
    "cryptography>=42.0.0",
    
    # Model Context Protocol & Agents
    # Floors are the versions this code actually exercises, not the versions it
    # was first written against. `langgraph>=1.2` is load-bearing: the per-node
    # `retry_policy` / `timeout=` / `error_handler=` kwargs and `stream_mode=
    # "custom"` all require 1.2 (see _build_workflow and api/v1/conversations).
    # A lower floor does not fail at install -- it fails at compile() or at
    # runtime, which is the expensive way to find out.
    "fastmcp>=4.0.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langchain-core>=1.6.1",
    
    # LLM Routing, Structured Output & Tools
    "litellm>=1.40.0",
    "instructor>=1.3.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    
    # Vector DB & Embeddings & RAG
    # [fastembed] extra: the local CPU fallback for embeddings in
    # services/rag/retrieval.py. Without the extra the module is simply absent,
    # so the "offline" fallback raised ModuleNotFoundError the moment
    # GEMINI_API_KEY was unset. fastembed is ONNX-based (no torch); onnxruntime
    # is already present via flashrank.
    "qdrant-client[fastembed]>=1.9.0",
    "rank-bm25>=0.2.2",
    "flashrank>=0.2.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    
    # Sandboxing & Web Research
    "e2b-code-interpreter>=0.0.10",
    "firecrawl-py>=0.0.16",
    "ddgs>=9.16",
    
    # Observability & Evaluation
    # ragas + garak were removed in 2026-09 after the dependency audit:
    #   - ragas  PYSEC-2026-3046 (SSRF, no fixed release through 0.4.3)
    #   - garak  transitively pinned vulnerable nltk/datasets/accelerate
    # A paid-LLM evaluation framework was removed in the same audit pass: its
    # "genuine judge" metrics default to a paid OpenAI model, and everything it
    # adds runs through the project's own deterministic heuristics
    # (evaluation/heuristic_eval_service.py) or the app's litellm client
    # (prompt-regression gate) — both 100% free tier.
    # Re-add any of these only if a patched version lands AND the library is
    # actually used.
    "guardrails-ai>=0.5.0",
    # edge-tts: free, key-less TTS via Microsoft Edge neural voices (2026-09).
    # Dropped Minimax (needs paid credits). No provider key or billing needed.
    # >=7.3.0 is required, not merely newer: Microsoft moved the readaloud
    # endpoint to the Sec-MS-GEC v2 handshake, and every earlier release gets a
    # 403 on the WSS upgrade (verified: 7.2.8 -> 403, 7.3.1 -> audio bytes).
    "edge-tts>=7.3.0",
    "structlog>=24.0.0",
    
    # Memory Management
    "mem0ai>=0.1.0",

    # Utilities
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres]>=4.0.0",
    "psycopg2-binary>=2.9.9",
    "black>=24.4.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "isort>=5.13.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "hypothesis>=6.168.2",
    "locust>=2.46.6",
    "pytest-randomly>=3.15.0",
]

[project.optional-dependencies]
observability = [
    # Optional Layer-1 → Layer-2 log transport (OTLP/HTTP to the collector that
    # owns the New Relic key). The app runs fine without it — NEW_RELIC_ENABLED
    # gates the export and all opentelemetry imports are lazy (see
    # services/observability/logs.py). No new CVEs: opentelemetry-sdk and the
    # OTLP HTTP exporter are the same maintained line the ecosystem uses.
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-exporter-otlp-proto-http>=1.26.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "E712"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401"]
"app/api/deps.py" = ["F821"]
"app/core/exceptions.py" = ["N818"]
"tests/integration/conftest.py" = ["E402"]
# Importing a fixture function into a test module is how pytest makes it
# resolvable by name, so F811 fires on every test that takes that fixture as a
# parameter. That is the intended shape of the file, not a redefinition.
"tests/agents/test_run_interrupt_resume.py" = ["F811"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.bandit]
# Scans the runtime package (not tests: assert-heavy test code triggers B101
# noise; the security job's real target is app code). Excludes nothing in app;
# use targeted "# nosec" comments for intentional patterns instead of blanket
# skips. Validate with:  uv run bandit -c pyproject.toml -r app -q
targets = ["app"]
exclude_dirs = [".venv", "tests", "migrations"]
skips = []

[tool.pytest.ini_options]
  asyncio_mode = "auto"
  asyncio_default_test_loop_scope = "session"
  asyncio_default_fixture_loop_scope = "session"
  addopts = "-v -m 'not e2e'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that exercise repositories/routes against a real (test) database",
    "e2e: marks full-stack tests that boot a live uvicorn server (deselect by default; run with '-m e2e')",
]
