version: "3.9"

# ─── Nexus AI Assistant – Local Development Stack ────────────────────────────
# Brings up all infrastructure services required for local development.
# The backend and frontend are run separately via npm/uvicorn for hot reload.
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose down -v        # Stop and remove volumes
#
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL (async via asyncpg) ─────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus_postgres
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Celery broker + result backend + LiteLLM cache) ─────────────────
  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant (Vector + Hybrid search) ────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.1
    container_name: nexus_qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Layer-2: OpenTelemetry Collector (observability transport agent) ──────
  # Receives the app's OTLP logs on :4318, tail-samples, batches, and forwards
  # to New Relic (Layer-3 sink) using NEW_RELIC_LICENSE_KEY. It also scrapes
  # the app's /metrics — the app runs on the HOST in dev, so the agent reaches
  # it via host.docker.internal (extra_hosts host-gateway). See
  # docker/otel-collector-config.yaml for the full flow. Set before starting
  # (PowerShell):  $env:NEW_RELIC_LICENSE_KEY = "xxxx"
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    container_name: nexus_otel_collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-not-set}
      - ENVIRONMENT=development
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - METRICS_SCRAPE_TARGET=${METRICS_SCRAPE_TARGET:-host.docker.internal:8000}
    ports:
      - "4317:4317"   # OTLP/gRPC (optional)
      - "4318:4318"   # OTLP/HTTP — what the app pushes logs to
      - "8888:8888"   # collector self-metrics
      - "13133:13133" # /healthz

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
