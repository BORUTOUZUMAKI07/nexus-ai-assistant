version: "3.9"

# ─── Nexus AI Assistant – Local Development Stack ────────────────────────────
# Brings up all infrastructure services required for local development.
# The backend and frontend are run separately via npm/uvicorn for hot reload.
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose down -v        # Stop and remove volumes
#
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL (async via asyncpg) ─────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus_postgres
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Celery broker + result backend + LiteLLM cache) ─────────────────
  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant (Vector + Hybrid search) ────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.1
    container_name: nexus_qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── MinIO (S3-compatible object storage for file uploads) ──────────────────
  minio:
    image: minio/minio:latest
    container_name: nexus_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    environment:
      MINIO_ROOT_USER: nexus
      MINIO_ROOT_PASSWORD: nexuspassword
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
