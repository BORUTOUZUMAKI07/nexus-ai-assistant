# Nexus AI Assistant — Layer-2 OpenTelemetry Collector (collection & transport).
#
# Data flow (3-layer observability):
#   Layer 1 (in-process)   app only: /metrics Prometheus endpoint (a local
#                          debug view + optional bearer auth), OTLP logs,
#                          metrics AND traces export (NEW_RELIC_ENABLED),
#                          LangSmith LLM traces, Sentry errors.
#   Layer 2 (this agent)   receives OTLP logs/traces/metrics on :4318, tail-
#                          samples traces, batches, queues durably to disk, and
#                          forwards to Layer 3.
#   Layer 3 (sink)         New Relic (otlphttp exporter below). The agent owns
#                          the NEW_RELIC_LICENSE_KEY and forwards on — the app
#                          never holds vendor credentials.
#
# Why OTLP for metrics and not a Prometheus scrape: a scrape reads whichever
# process answers, so a multi-worker/multi-instance deploy silently undercounts
# (each process keeps its own in-memory counters). Pushing from every process
# lets the collector aggregate, and it removes the app's public /metrics
# endpoint as a delivery path. The app's /metrics remains as a local debug view.
#
# Security: the OTLP receiver REQUIRES HTTP basic auth (see basicauth/server).
# That matters because on a free-tier Render service :4318 is public — anyone
# could POST junk and burn the New Relic free tier. The app sends the matching
# Authorization: Basic header (OTLP_AUTH_USER / OTLP_AUTH_PASSWORD). CHANGE THE
# DEFAULT CREDENTIALS IN PRODUCTION (see render.yaml / docker-compose.yml).
#
# Env vars:
#   NEW_RELIC_LICENSE_KEY  required  New Relic ingest key (agent-side only).
#   ENVIRONMENT            required  deployment.environment resource attribute.
#   SERVICE_VERSION        optional  service.version resource attribute.
#   OTLP_AUTH_USER         required  basic-auth user (matches the app).
#   OTLP_AUTH_PASSWORD     required  basic-auth password (matches the app).
#
# Data flow note: `file_storage` gives the exporter a durable sending queue so
# a New Relic outage buffers to disk instead of dropping telemetry. The queue
# directory (/var/lib/otelcol/storage) is provided by the runtime — a named
# volume in docker-compose, created in the Dockerfile for Render. On Render's
# free tier there is no persistent disk, so the buffer survives a sink outage
# and a process restart but not a container *recreate*.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: basicauth/server
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: basicauth/server
  # Debug-only alternative: scrape the app's local /metrics (Prometheus text).
  # Not in any pipeline — the otlp receiver above is the live metrics path now.
  # Kept so a single-node debug session can cross-check the OTLP series against
  # the endpoint. Uncomment the receiver, the pipeline below, and set
  # METRICS_SCRAPE_TARGET / METRICS_TOKEN on the collector to use it.
  # prometheus:
  #   config:
  #     scrape_configs:
  #       - job_name: nexus-debug
  #         scrape_interval: 30s
  #         metrics_path: /metrics
  #         authorization: {credentials: ${env:METRICS_TOKEN}}
  #         static_configs:
  #           - targets: ["${env:METRICS_SCRAPE_TARGET}"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  # Tail-sampling: keep every error and slow span, ~10% of the rest. The app
  # sends its full trace stream and the agent decides what reaches New Relic.
  tail_sampling:
    decision_wait: 10s
    num_traces: 10000
    expected_new_traces_per_sec: 50
    policies:
      - name: keep-all-errors
        type: status_code
        status_code: {status_codes: [ERROR]}
      # UNSET is a normal span's default status. Listing it kept *every* trace
      # here, so the 10%-of-the-rest policy below never dropped anything.
      - name: keep-slow
        type: latency
        latency:
          threshold_ms: 2000
      - name: sample-rest
        type: probabilistic
        probabilistic: {sampling_percentage: 10}
  batch:
    send_batch_size: 512
    timeout: 5s
  # `action` is REQUIRED on every entry in collector-contrib v0.121: leaving it
  # out yields an empty action, and the processor refuses to build --
  #     failed to create "resource" processor ... unsupported action ""
  # which kills the collector at startup (exit 1) before /healthz ever answers.
  # `upsert` is the intended semantics: set the attribute, or overwrite it if a
  # sender already set one.
  resource:
    attributes:
      - key: deployment.environment
        value: ${env:ENVIRONMENT}
        action: upsert
      - key: service.name
        value: nexus-ai-assistant
        action: upsert
      - key: service.version
        value: ${env:SERVICE_VERSION}
        action: upsert

exporters:
  otlphttp/newrelic:
    endpoint: https://otlp.nr-data.net:4318
    headers:
      api-key: ${env:NEW_RELIC_LICENSE_KEY}
    compression: gzip
    # Durable queue: if New Relic is unreachable, batches spill to file_storage
    # in the extension below and are replayed on recovery instead of dropped.
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000
      storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      # Bounded so a New Relic 429 (free-tier quota) drops the batch after 5
      # minutes rather than retrying forever and wedging the queue.
      max_elapsed_time: 300s
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 20
  # Grafana fan-out (ready stub — uncomment to mirror events into a second
  # vendor alongside New Relic; needs GRAFANA_OTLP_ENDPOINT / GRAFANA_OTLP_TOKEN):
  # otlphttp/grafana:
  #   endpoint: ${env:GRAFANA_OTLP_ENDPOINT}
  #   headers:
  #     Authorization: Basic ${env:GRAFANA_OTLP_TOKEN}

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # Durable queue backing store (see exporting path above). The directory is
  # provided by the runtime (a named volume in docker-compose, created in the
  # Dockerfile for Render); create_directory covers a host that pre-provisions a
  # writable parent instead.
  file_storage:
    directory: /var/lib/otelcol/storage
    create_directory: true
  # Basic auth on the OTLP receiver. `inline` is a `user:password` pair; the
  # default nexus/nexus is a placeholder that MUST be changed in production.
  basicauth/server:
    htpasswd:
      inline: "${env:OTLP_AUTH_USER}:${env:OTLP_AUTH_PASSWORD}"

service:
  extensions: [health_check, file_storage, basicauth/server]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlphttp/newrelic, debug]
    # Metrics arrive over OTLP from every app process (see file header).
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlphttp/newrelic, debug]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch, resource]
      exporters: [otlphttp/newrelic, debug]
