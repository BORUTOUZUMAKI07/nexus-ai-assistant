name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write      # required for provenance attestation
      attestations: write  # required to persist provenance attestations
      security-events: write  # required for SBOM upload

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lowercase repository name (Docker tags must be lowercase)
        shell: bash
        run: echo "REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up SBOM tooling (syft)
        uses: anchore/sbom-action/download-syft@v0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push backend
        id: build-backend
        shell: bash
        run: |
          docker buildx build \
            --metadata-file /tmp/backend-meta.json \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/backend:${{ steps.version.outputs.VERSION }} \
            --tag ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/backend:latest \
            --push \
            ./backend
          echo "digest=$(jq -r '.["containerimage.digest"]' /tmp/backend-meta.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend
        id: build-frontend
        shell: bash
        run: |
          docker buildx build \
            --metadata-file /tmp/frontend-meta.json \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/frontend:${{ steps.version.outputs.VERSION }} \
            --tag ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/frontend:latest \
            --push \
            ./frontend
          echo "digest=$(jq -r '.["containerimage.digest"]' /tmp/frontend-meta.json)" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM for backend
        shell: bash
        run: |
          syft ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/backend:${{ steps.version.outputs.VERSION }} -o spdx-json=backend-sbom-${{ steps.version.outputs.VERSION }}.spdx.json -o cyclonedx-json=backend-sbom-${{ steps.version.outputs.VERSION }}.cyclonedx.json

      - name: Generate SBOM for frontend
        shell: bash
        run: |
          syft ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/frontend:${{ steps.version.outputs.VERSION }} -o spdx-json=frontend-sbom-${{ steps.version.outputs.VERSION }}.spdx.json -o cyclonedx-json=frontend-sbom-${{ steps.version.outputs.VERSION }}.cyclonedx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sboms-${{ steps.version.outputs.VERSION }}
          path: |
            *-sbom-*.spdx.json
            *-sbom-*.cyclonedx.json

      # Bind the attestation to the images actually pushed to GHCR, not to the
      # Dockerfiles. A Dockerfile subject would "prove" the provenance of a
      # source file nobody pulls, while the shipped image went unattested.
      - name: Attest backend image provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/backend
          subject-digest: ${{ steps.build-backend.outputs.digest }}
          push-to-registry: true

      - name: Attest frontend image provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/frontend
          subject-digest: ${{ steps.build-frontend.outputs.digest }}
          push-to-registry: true

      - name: Generate changelog (fixed range since previous tag)
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_OUTPUT
          git log --oneline "${PREV_TAG}..HEAD" --format="- %s" > /tmp/changelog.txt
          echo "---" >> /tmp/changelog.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: /tmp/changelog.txt
          draft: false
          prerelease: false
