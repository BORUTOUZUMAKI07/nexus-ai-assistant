name: Keep Render warm

on:
  schedule:
    # Render's free instances suspend after ~15 minutes idle. A five-minute
    # heartbeat keeps both the API and the OTLP collector ready so the first
    # user request does not pay a 50-60s cold start and telemetry is not lost.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: render-keepalive
  # A cold start can outlast one five-minute interval. Cancelling the previous
  # run exactly when it is about to finish waking Render left both services
  # asleep, so overlap must be allowed to complete.
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wake backend
        # A single 30s request treated Render's 503 "waking up" response as a
        # hard failure. Poll long enough for a real cold start instead.
        run: |
          set -uo pipefail
          url="https://nexus-backend-owq5.onrender.com/health"
          expected="200"
          code="000"
          for attempt in $(seq 1 12); do
            code=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$url" || true)
            echo "backend attempt ${attempt}/12: HTTP ${code}"
            if [ "$code" = "$expected" ]; then
              echo "Backend awake (${code} from /health)"
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 10
            fi
          done
          echo "Backend did not wake after 12 attempts (last status: ${code})"
          exit 1

  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wake OTLP collector
        # The receiver requires HTTP basic auth, so 401 means it is awake; 503
        # means Render has not finished starting it yet.
        run: |
          set -uo pipefail
          url="https://nexus-otel-collector.onrender.com/"
          expected="401"
          code="000"
          for attempt in $(seq 1 12); do
            code=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$url" || true)
            echo "collector attempt ${attempt}/12: HTTP ${code}"
            if [ "$code" = "$expected" ]; then
              echo "Collector awake (${code} Unauthorized from basic auth, as expected)"
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 10
            fi
          done
          echo "Collector did not wake after 12 attempts (last status: ${code})"
          exit 1
