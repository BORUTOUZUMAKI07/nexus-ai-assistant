name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  nightly-backend:
    name: Nightly Backend Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Attribution (scheduling attribution, not a gate)
        # Records which trigger actually started the run: GitHub's scheduler
        # has shown delayed/missing `schedule` events. Never gate on this value.
        working-directory: ${{ github.workspace }}
        run: |
          echo "entry_point: github_actions"
          echo "trigger_event: ${{ github.event_name }}"
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --group dev
      - name: Security scans (bandit + pip-audit)
        # Same gates as the CI security job — rerun nightly because dependency
        # ceilings can land new advisories on a fresh `uv sync` even when PR
        # CI was green. No ignores: python-jose and ecdsa were replaced by
        # PyJWT, so neither PYSEC-2026-4298 nor PYSEC-2026-1325 is in the tree.
        # See ci.yml.
        shell: bash
        run: |
          uv run bandit -c pyproject.toml -r app -q
          uv run pip-audit -l --skip-editable
      - name: Run full backend test suite (unit + integration + e2e)
        shell: bash
        run: |
          uv run pytest tests/ -q -p no:cacheprovider 2>&1 | tee /tmp/nightly_output.log
          uv run pytest tests/e2e -q -p no:cacheprovider -m e2e 2>&1 | tee -a /tmp/nightly_output.log
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - name: Smoke check deployed dependency health
        # A sleeping free-tier Render instance can answer nothing for 30s+.
        # The warmup request wakes it and is allowed to fail; the strict loop
        # then retries long enough to tell a slow cold start from a real outage.
        # A degraded dependency still fails the nightly run so this is an actual
        # alarm, not a log nobody reads. Only statuses are printed; no
        # credentials are interpolated into the step.
        shell: bash
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL || 'https://nexus-backend-owq5.onrender.com' }}
        run: |
          set -euo pipefail
          # Warmup: a sleeping instance may answer nothing for up to 90s. That
          # is expected, so this request must never fail the step.
          curl -fsS --max-time 90 "$SMOKE_BASE_URL/health" >/dev/null 2>&1 || true
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 60 "$SMOKE_BASE_URL/health" >/dev/null \
              && curl -fsS --max-time 60 "$SMOKE_BASE_URL/health/ready" >/dev/null \
              && curl -fsS --max-time 60 "$SMOKE_BASE_URL/health/dependencies" > /tmp/nightly_dependencies.json; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "deployed health probe failed after 5 attempts"
              exit 1
            fi
            sleep 15
          done
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/nightly_dependencies.json").read_text())
          degraded = sorted(k for k, v in data["services"].items() if v["status"] == "degraded")
          print(f"dependency_status={data['status']}")
          print(f"degraded={','.join(degraded) or 'none'}")
          print(f"fallback_counters={data['fallback_counters']}")
          if data["status"] != "ok":
              raise SystemExit(1)
          PY
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-backend-log
          path: /tmp/nightly_output.log

  nightly-frontend:
    name: Nightly Frontend Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Attribution (scheduling attribution, not a gate)
        working-directory: ${{ github.workspace }}
        run: |
          echo "entry_point: github_actions"
          echo "trigger_event: ${{ github.event_name }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: npm audit (frontend lockfile)
        run: npm run audit:gate
      - run: npm run test -- --coverage