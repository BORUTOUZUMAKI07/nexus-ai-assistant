name: CI

# CI workflow for the Nexus AI Assistant backend.
#
# Every push/PR runs the full unit + behavioral-invariant suite. The live
# LLM-judge prompt-regression gate is a separate, credential-gated job: it only
# executes when the RUN_LLM_EVAL_GATES secret is explicitly exported, so
# contributors without model credentials never see a false red, while release
# pipelines that set it get the real "CI stopped for prompts" check.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit suite + regression gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend (dev extras)
        run: pip install -e ".[dev]"

      - name: Unit + behavioral-invariant suite
        # Offline heuristic gate stays on by default (test_eval_upgrades).
        # -m "not e2e" matches the project's pytest defaults.
        env:
          ENVIRONMENT: development
        run: pytest -p no:deepeval -m "not e2e"

      - name: Lint (informational)
        continue-on-error: true
        run: ruff check app tests

  prompt-regression-gate:
    name: Live prompt-regression gate
    runs-on: ubuntu-latest
    # Deliberately env-guarded: this job needs live model credentials
    # (plus a Qdrant/DB optional — the gate is prompt-only). Set the
    # RUN_LLM_EVAL_GATES repository secret to "1" plus LLM provider keys
    # (GROQ_API_KEY etc.) to arm it on releases.
    if: env.RUN_LLM_EVAL_GATES == '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Run live prompt-regression gate
        env:
          RUN_LLM_EVAL_GATES: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pytest tests/test_prompt_regression_gate.py -p no:deepeval