name: CI

# CI workflow for the Nexus AI Assistant monorepo.
#
# Every push/PR runs:
#   1. Backend lint + type check (fail-fast)
#   2. Backend unit + behavioral-invariant suite
#   3. Frontend typecheck, lint, vitest suite and next build
#   4. Security scans (bandit + pip-audit + npm audit)
#
# The live LLM-judge gates are credential-gated and only run when
# RUN_LLM_EVAL_GATES == '1'.

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked dev environment
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check app tests

  typecheck:
    name: Type check (mypy allowlist)
    runs-on: ubuntu-latest
    needs: [lint]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked dev environment
        run: uv sync --group dev

      - name: mypy over allowlist
        shell: bash
        working-directory: ${{ github.workspace }}
        run: bash scripts/typecheck.sh

  backend-test:
    name: Unit suite + regression gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked dev environment
        run: uv sync --group dev

      - name: Unit + behavioral-invariant suite
        env:
          ENVIRONMENT: development
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: uv run pytest -m "not e2e"

  frontend:
    name: Frontend typecheck + lint + tests + build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --legacy-peer-deps

      - name: Generate route types (for tsc)
        run: npx next typegen

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src scripts

      - name: Unit suite (vitest)
        run: npm run test

      - name: Production build
        run: npm run build

  security:
    name: Security scans (bandit + pip-audit + npm audit)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked dev environment
        run: uv sync --group dev

      - name: Bandit (backend app)
        run: uv run bandit -c pyproject.toml -r app -q

      - name: pip-audit (locked venv)
        run: uv run pip-audit -l --skip-editable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: npm audit (frontend)
        working-directory: frontend
        run: npm run audit:gate

  live-llm-eval-gates:
    name: Live LLM-judge gates (prompt-regression + arena + conversational + RAG)
    runs-on: ubuntu-latest
    needs: [backend-test]
    if: vars.RUN_LLM_EVAL_GATES == '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install locked dev environment
        run: uv sync --group dev
      - name: Run live LLM-judge gates
        env:
          RUN_LLM_EVAL_GATES: "1"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run pytest tests/test_prompt_regression_gate.py tests/test_live_eval_gates.py
