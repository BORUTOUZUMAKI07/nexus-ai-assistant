name: CI

# CI workflow for the Nexus AI Assistant monorepo.
#
# Every push/PR runs:
#   1. Backend unit + behavioral-invariant suite (always includes the offline
#      arena/conversational/prompt-regression heuristics).
#   2. Static type-check over a curated mypy allowlist (see
#      backend/scripts/mypy_targets.txt — the full app graph still carries
#      pre-existing strict-mode debt, so the gate grows module-by-module).
#   3. Frontend typecheck (tsc --noEmit), lint, vitest suite and next build.
#   4. Security scans: bandit over app/, pip-audit over the locked venv, npm
#      audit for the frontend lockfile.
#
# The live LLM-judge gates — prompt-regression, arena pairwise judgment,
# conversational compliance and RAG faithfulness — are a separate,
# credential-gated job: they only execute when the RUN_LLM_EVAL_GATES secret is
# explicitly exported, so contributors without model credentials never see a
# false red, while release pipelines that set it get the real "CI stopped for
# prompts + evaluator output" checks.
on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  test:
    name: Unit suite + regression gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked dev environment
        run: uv sync --group dev

      - name: Unit + behavioral-invariant suite
        # Offline heuristic gate stays on by default (test_eval_upgrades).
        # -m "not e2e" matches the project's pytest defaults.
        env:
          ENVIRONMENT: development
        run: uv run pytest -p no:deepeval -m "not e2e"

      - name: Lint (informational)
        # The repo carries pre-existing ruff debt, so lint never hard-fails a
        # PR; typecheck + security jobs below are the hard gates.
        continue-on-error: true
        run: uv run ruff check app tests

  typecheck:
    name: Type check (mypy allowlist)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked dev environment
        run: uv sync --group dev

      - name: mypy over allowlist
        shell: bash
        run: |
          # mypy_targets.txt is repo-root-relative (backend/app/...) with '#'
          # comment lines; strip the prefix so paths resolve from ./backend.
          mapfile -t TARGETS < <(grep -v '^#' scripts/mypy_targets.txt | sed 's|^backend/||')
          uv run mypy --follow-imports=silent "${TARGETS[@]}"

  frontend:
    name: Frontend typecheck + lint + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --legacy-peer-deps

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit suite (vitest)
        run: npm run test

      - name: Production build
        run: npm run build

  security:
    name: Security scans (bandit + pip-audit + npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked dev environment
        run: uv sync --group dev

      - name: Bandit (backend app)
        # Config lives in backend/pyproject.toml [tool.bandit]: targets app,
        # excludes .venv/tests, and intentional patterns carry # nosec Bxxx.
        run: uv run bandit -c pyproject.toml -r app -q

      - name: pip-audit (locked venv)
        # Only PYSEC-2026-1325 (Minerva timing attack on P-256) is ignored and
        # only because no patched release exists AND it is not exploitable
        # here: python-jose ships ecdsa for ES* algorithms the app never uses
        # (JWT_ALGORITHM=HS256, see the pyproject comment near python-jose).
        # New advisories with published fixes fail this job on purpose.
        run: uv run pip-audit -l --skip-editable --ignore-vuln PYSEC-2026-1325

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high

  live-llm-eval-gates:
    name: Live LLM-judge gates (prompt-regression + arena + conversational + RAG)
    runs-on: ubuntu-latest
    # Deliberately env-guarded: these jobs need live model credentials. Set the
    # RUN_LLM_EVAL_GATES repository secret to "1" plus provider keys to arm
    # them on releases. GROQ_API_KEY drives the prompt-regression gate (via the
    # app's own LLM client); OPENAI_API_KEY (DeepEval judges) upgrades the
    # arena/conversational/RAG gates from the offline heuristics to genuine
    # LLM-judge verdicts — both modes enforce the report contract.
    if: env.RUN_LLM_EVAL_GATES == '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install locked dev environment
        run: uv sync --group dev
      - name: Run live LLM-judge gates
        env:
          RUN_LLM_EVAL_GATES: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run pytest tests/test_prompt_regression_gate.py tests/test_live_eval_gates.py -p no:deepeval